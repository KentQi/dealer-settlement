name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 校验插件与技能清单
        run: python tools/validate.py

      - name: 语法编译检查
        run: python -m compileall -q skills examples tools

      - name: 端到端演示（建档 → 对账 → 自检）
        run: python examples/run_demo.py

      - name: 构建技能安装包
        run: make package

      - name: 上传安装包
        uses: actions/upload-artifact@v7
        with:
          name: dealer-settlement-zip-py${{ matrix.python-version }}
          path: dist/dealer-settlement.zip
          if-no-files-found: error
