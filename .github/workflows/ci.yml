name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest（26.04）尚无 Python 3.9 预编译包，固定到 24.04
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装中文字体（签章 PDF 回归用）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-wqy-zenhei

      - name: 校验插件与技能清单
        run: python tools/validate.py

      - name: 语法编译检查
        run: python -m compileall -q skills examples tools

      - name: 端到端演示（对账 → L6 复核 → 结构映射 → v1.7 门禁）
        run: make demo

      - name: 构建技能安装包
        run: make package

      - name: 上传安装包
        uses: actions/upload-artifact@v7
        with:
          name: dealer-settlement-zip-py${{ matrix.python-version }}
          path: dist/dealer-settlement.zip
          if-no-files-found: error
